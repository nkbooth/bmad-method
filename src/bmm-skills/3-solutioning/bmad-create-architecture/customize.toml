[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (standards, compliance constraints, stylistic guardrails).
# Distinct from the runtime memory sidecar — these are static context
# loaded on activation. Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "Our org is AWS-only -- do not propose GCP or Azure."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = [
  "file:{project-root}/**/project-context.md",
  "Language selection rules (apply before recommending any technology): Rust — compiled/binary backend, performance-critical, standalone binary. Python — quick scripts, data work, service APIs where iteration speed matters. Bash — shell glue, CI steps, system automation. C#/.NET — Windows-adjacent or enterprise .NET ecosystem requirements. TypeScript+React — frontend/SPA only, Vite as build tool, TypeScript always. Do NOT suggest Go, Java, PHP, or Ruby unless the user explicitly overrides this constraint.",
  "Every project must include a devcontainer (.devcontainer/devcontainer.json) and a CI workflow. The architecture document must specify the devcontainer base image for the chosen language stack. Development toolchains are never installed on the host.",
  "Package managers by stack: uv for Python, native cargo for Rust, dotnet SDK for C#, npm for TypeScript. For containerised services: prefer UBI9 base images (ubi for build stages, ubi-minimal for runtime stages).",
  "Testing strategy must be explicit in the architecture: specify test framework, coverage expectations, and confirm TDD (test-first) as the required development practice.",
  "Secrets management: use 1Password CLI (op run) for local dev; CI wiring is a TODO until the 1Password service account integration is resolved. Never commit raw secrets or suggest GH-native secrets as a long-term approach.",
]

# Scalar: executed when the workflow reaches Step 8 (Architecture Completion & Handoff),
# after the architecture document frontmatter is updated and next-steps guidance is given.
# Override wins. Leave empty for no custom post-completion behavior.

on_complete = ""
